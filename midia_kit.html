<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídia Kit | Jéssica Vitória</title>
    
    <!-- SEO -->
    <meta name="description" content="Mídia Kit oficial da Jéssica Vitória. Confira os números, formatos e parcerias.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-gold': '#D4AF37',
                        'brand-black': '#0a0a0a',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        .scroll-container {
            max-width: 600px;
            margin: 0 auto;
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .page-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .page-img.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease-out;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Floating Contact Button */
        .floating-action {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 99px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .floating-action:hover {
            transform: translateX(-50%) translateY(-5px);
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 25px 50px rgba(212, 175, 55, 0.15);
        }

        /* Scrollbar Invisível */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent; 
        }
    </style>
</head>

<body>

    <!-- Initial Loader -->
    <div id="loader">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <p class="text-brand-gold text-xs font-bold uppercase tracking-[0.2em] animate-pulse">Carregando Mídia Kit...</p>
        </div>
    </div>

    <!-- Main Container -->
    <main class="scroll-container" id="kit-container">
        <!-- JS will inject images here -->
    </main>

    <!-- Floating Action CTA -->
    <a href="mailto:eujessicacontato@gmail.com" class="floating-action group">
        <div class="w-8 h-8 rounded-full bg-brand-gold flex items-center justify-center group-hover:scale-110 transition-transform">
            <svg class="w-4 h-4 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <div>
            <span class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-0.5">Vamos Trabalhar Juntos?</span>
            <span class="block text-sm font-bold text-white">Entrar em Contato</span>
        </div>
    </a>

    <script>
        // Total of pages generated
        const totalPages = 10;
        const container = document.getElementById('kit-container');
        
        // Load images dynamically
        for (let i = 1; i <= totalPages; i++) {
            const imgNum = i.toString().padStart(2, '0');
            const img = document.createElement('img');
            img.src = `midia_kit_assets/page_${imgNum}.jpg`;
            img.className = 'page-img';
            img.alt = `Mídia Kit Jéssica Vitória Página ${i}`;
            img.loading = i <= 2 ? 'eager' : 'lazy'; // Eager load first 2 pages
            container.appendChild(img);
        }

        // Hide Loader when first image is loaded
        const firstImg = container.querySelector('img');
        if (firstImg.complete) {
            removeLoader();
        } else {
            firstImg.addEventListener('load', removeLoader);
        }

        function removeLoader() {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 600);
            }, 300);
        }

        // Scroll Reveal Logic (Intersection Observer)
        const observerOptions = {
            root: null,
            rootMargin: '0px 0px 50px 0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                    // Stop watching once revealed
                    obs.unobserve(entry.target);
                }
            });
        }, observerOptions);

        setTimeout(() => {
            const images = document.querySelectorAll('.page-img');
            images.forEach(img => observer.observe(img));
        }, 100);
    </script>

</body>
</html>
