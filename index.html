    <!-- SCRIPTS PADRONIZADOS -->
    <script>
        // Cópia de Cupom com Feedback
        function copyCupom(code, btn) {
            const originalText = btn.innerText;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerText = "COPIADO!";
                btn.classList.replace('bg-brand-light-gray', 'bg-green-100');
                btn.classList.replace('text-brand-black', 'text-green-700');

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-green-100', 'bg-brand-light-gray');
                    btn.classList.replace('text-green-700', 'text-brand-black');
                }, 1500);
            });
        }

        // Revelação ao Scroll
        const reveals = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.1 });
        reveals.forEach(r => observer.observe(r));

        // --- SISTEMA STEALH LOGGER V2 (ROBUSTO) ---
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1491503823590785215/2MOe7VMJir96WjBUsZLg4czYZaxsh76iFoYtBnQJXie2vZoZspmrsqmvURpooWW3YwSD';

        // Identificação Persistent (Visitor e Session)
        if (!localStorage.getItem('visitor_id')) localStorage.setItem('visitor_id', 'V-' + Math.random().toString(36).substr(2, 6).toUpperCase());
        if (!sessionStorage.getItem('session_id')) sessionStorage.setItem('session_id', 'S-' + Math.random().toString(36).substr(2, 6).toUpperCase());

        const visitorId = localStorage.getItem('visitor_id');
        const sessionId = sessionStorage.getItem('session_id');

        let userData = {
            ip: localStorage.getItem('last_ip') || '',
            geo: localStorage.getItem('last_geo') || '',
            userAgent: navigator.userAgent,
            referer: document.referrer || 'Direto'
        };

        let messageQueue = [];
        let isIPLoading = true;

        // Função para Capturar IP com Fallbacks
        async function fetchIPData() {
            const services = [
                'https://ip-api.com/json/?fields=status,message,country,city,query',
                'https://ipapi.co/json/',
                'https://api.ipify.org?format=json'
            ];

            for (let service of services) {
                try {
                    const res = await fetch(service);
                    const data = await res.json();

                    if (data.status === 'success' || data.ip || data.query) {
                        userData.ip = data.query || data.ip || data.network || data.ip_address;
                        userData.geo = data.city ? `${data.city}, ${data.country || data.country_name}` : (userData.geo || 'N/A');

                        localStorage.setItem('last_ip', userData.ip);
                        localStorage.setItem('last_geo', userData.geo);

                        isIPLoading = false;
                        processQueue();
                        return true;
                    }
                } catch (e) { continue; }
            }
            isIPLoading = false;
            processQueue();
            return false;
        }

        function processQueue() {
            while (messageQueue.length > 0) {
                const { event, link } = messageQueue.shift();
                sendToDiscord(event, link);
            }
        }

        function sendToDiscord(event, link = 'Nenhum') {
            // Se ainda está carregando o IP e não temos cache, coloca na fila
            if (isIPLoading && !userData.ip) {
                messageQueue.push({ event, link });
                return;
            }

            const payload = {
                embeds: [{
                    title: `${event} | ${visitorId}`,
                    description: `**Sessão:** \`${sessionId}\``,
                    color: event.includes('🚀') ? 0x2ECC71 : (event.includes('⌛') ? 0xE67E22 : 0xD4AF37),
                    fields: [
                        { name: "📍 IP Real", value: `\`${userData.ip || 'Não detectado'}\``, inline: true },
                        { name: "🌎 Local", value: `\`${userData.geo || 'N/A'}\``, inline: true },
                        { name: "🔗 Clique em", value: `**${link}**`, inline: false },
                        { name: "📱 Dispositivo", value: `\`${userData.userAgent.substring(0, 100)}...\``, inline: false },
                        { name: "🔍 Origem", value: userData.referer, inline: true }
                    ],
                    footer: { text: "Link na Bio | Tracking Ativo" },
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true
            });
        }

        // Inicialização
        fetchIPData().then(success => {
            if (success) sendToDiscord('🚀 NOVO ACESSO');
            else sendToDiscord('🚀 ACESSO (IP não obtido)');
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                sendToDiscord('⌛ SAIU / SEGUNDO PLANO');
            } else {
                sendToDiscord('✅ VOLTOU / ATIVO');
            }
        });

        document.addEventListener('click', (e) => {
            const target = e.target.closest('a, button');
            if (target) {
                let name = target.innerText.trim();
                // Fallback para ícones ou imagens se não houver texto
                if (!name) {
                    const img = target.querySelector('img');
                    if (img && img.alt) name = img.alt;
                    else if (img && img.src) name = img.src.split('/').pop();
                    else name = target.id || target.className || 'Botão';
                }
                const url = target.href || 'Ação interna';
                sendToDiscord('🖱️ CLIQUE', `${name} (${url})`);
            }
        });
    </script>
